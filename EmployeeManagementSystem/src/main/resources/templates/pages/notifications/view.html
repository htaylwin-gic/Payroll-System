<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/dashboard-layout}">
<head>
    <title>Notifications</title>
    <style>
        .notification-item {
            padding: 15px 20px;
            border-bottom: 1px solid #dee2e6;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .notification-item:hover {
            background-color: #f8f9fa;
        }
        .notification-item.unread {
            background-color: #e8f0fe;
            border-left: 4px solid #0d6efd;
        }
        .notification-item.unread:hover {
            background-color: #d9e9ff;
        }
        .notification-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
        }
        .notification-icon.info {
            background: linear-gradient(135deg, #17a2b8 0%, #138496 100%);
        }
        .notification-icon.success {
            background: linear-gradient(135deg, #28a745 0%, #218838 100%);
        }
        .notification-icon.warning {
            background: linear-gradient(135deg, #ffc107 0%, #e0a800 100%);
        }
        .notification-icon.error {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
        }
        .notification-time {
            font-size: 0.8rem;
            color: #6c757d;
        }
        .notification-actions {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .notification-item:hover .notification-actions {
            opacity: 1;
        }
        .filter-badge {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .filter-badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .stats-card {
            border: none;
            border-radius: 10px;
            color: white;
            padding: 20px;
            transition: transform 0.3s ease;
        }
        .stats-card:hover {
            transform: translateY(-5px);
        }
        .stats-icon {
            font-size: 2.5rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div layout:fragment="dashboard-content">
        <!-- Page Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="mb-0">
                    <i class="fas fa-bell me-2"></i>
                    Notifications
                </h4>
                <p class="text-muted mb-0">Stay updated with system activities</p>
            </div>
            <div>
                <button class="btn btn-outline-primary me-2" onclick="markAllAsRead()" th:if="${unreadCount > 0}">
                    <i class="fas fa-check-double me-2"></i> Mark All as Read
                </button>
                <button class="btn btn-outline-danger" onclick="clearAll()" th:if="${not #lists.isEmpty(notifications)}">
                    <i class="fas fa-trash me-2"></i> Clear All
                </button>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="stats-card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                    <div class="row align-items-center">
                        <div class="col-8">
                            <h6 class="text-white mb-1">Total</h6>
                            <h3 class="text-white mb-0" th:text="${notifications != null ? #lists.size(notifications) : 0}">0</h3>
                        </div>
                        <div class="col-4 text-end">
                            <i class="fas fa-bell stats-icon"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card" style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%);">
                    <div class="row align-items-center">
                        <div class="col-8">
                            <h6 class="text-white mb-1">Unread</h6>
                            <h3 class="text-white mb-0" th:text="${unreadCount}">0</h3>
                        </div>
                        <div class="col-4 text-end">
                            <i class="fas fa-envelope stats-icon"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card" style="background: linear-gradient(135deg, #ffc107 0%, #fd7e14 100%);">
                    <div class="row align-items-center">
                        <div class="col-8">
                            <h6 class="text-white mb-1">Today</h6>
                            <h3 class="text-white mb-0" th:text="${todayCount != null ? todayCount : 0}">0</h3>
                        </div>
                        <div class="col-4 text-end">
                            <i class="fas fa-calendar-day stats-icon"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card" style="background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);">
                    <div class="row align-items-center">
                        <div class="col-8">
                            <h6 class="text-white mb-1">This Week</h6>
                            <h3 class="text-white mb-0" th:text="${weekCount != null ? weekCount : 0}">0</h3>
                        </div>
                        <div class="col-4 text-end">
                            <i class="fas fa-calendar-week stats-icon"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="card mb-4">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <div class="d-flex gap-2">
                            <span class="badge bg-primary filter-badge p-3" onclick="filterByType('all')">
                                <i class="fas fa-bell me-1"></i> All
                            </span>
                            <span class="badge bg-info filter-badge p-3" onclick="filterByType('INFO')">
                                <i class="fas fa-info-circle me-1"></i> Info
                            </span>
                            <span class="badge bg-success filter-badge p-3" onclick="filterByType('SUCCESS')">
                                <i class="fas fa-check-circle me-1"></i> Success
                            </span>
                            <span class="badge bg-warning filter-badge p-3" onclick="filterByType('WARNING')">
                                <i class="fas fa-exclamation-triangle me-1"></i> Warning
                            </span>
                            <span class="badge bg-danger filter-badge p-3" onclick="filterByType('ERROR')">
                                <i class="fas fa-times-circle me-1"></i> Error
                            </span>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="input-group">
                            <input type="text" class="form-control" placeholder="Search notifications..." id="searchInput">
                            <button class="btn btn-outline-primary" type="button" onclick="searchNotifications()">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Notifications List -->
<div class="card">
    <div class="card-body p-0">
        <div th:if="${notifications == null or #lists.isEmpty(notifications)}" class="text-center py-5">
            <i class="fas fa-bell-slash fa-4x text-muted mb-3"></i>
            <h5 class="text-muted">No notifications</h5>
            <p class="text-muted mb-0">You're all caught up!</p>
        </div>
        <div th:if="${notifications != null and not #lists.isEmpty(notifications)}">
            <div th:each="notif : ${notifications}" class="notification-item" 
                 th:classappend="${!notif.read} ? 'unread' : ''"
                 th:data-type="${notif.type}"
                 th:data-id="${notif.id}"
                 onclick="viewNotification(this.getAttribute('data-id'))">
                <div class="row">
                    <div class="col-auto">
                        <div class="notification-icon" th:classappend="'notification-icon ' + 
                            (${notif.type == 'INFO'} ? 'info' : 
                             ${notif.type == 'SUCCESS'} ? 'success' : 
                             ${notif.type == 'WARNING'} ? 'warning' : 
                             ${notif.type == 'ERROR'} ? 'error' : 'info')">
                            <i th:class="'fas ' + (${notif.icon != null} ? ${notif.icon} : 
                                (${notif.type == 'INFO'} ? 'fa-info-circle' : 
                                 ${notif.type == 'SUCCESS'} ? 'fa-check-circle' : 
                                 ${notif.type == 'WARNING'} ? 'fa-exclamation-triangle' : 
                                 ${notif.type == 'ERROR'} ? 'fa-times-circle' : 'fa-bell'))"></i>
                        </div>
                    </div>
                    <div class="col">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h6 class="mb-1" th:text="${notif.title}"></h6>
                                <p class="mb-1 text-muted" th:text="${notif.message}"></p>
                                <div class="d-flex align-items-center">
                                    <span class="badge me-2" th:classappend="
                                        ${notif.type == 'INFO'} ? 'bg-info' : 
                                        ${notif.type == 'SUCCESS'} ? 'bg-success' : 
                                        ${notif.type == 'WARNING'} ? 'bg-warning' : 
                                        ${notif.type == 'ERROR'} ? 'bg-danger' : 'bg-secondary'"
                                        th:text="${notif.type}"></span>
                                    <span class="notification-time">
                                        <i class="far fa-clock me-1"></i>
                                        <span th:text="${#temporals.format(notif.createdAt, 'dd MMM yyyy HH:mm')}"></span>
                                    </span>
                                </div>
                            </div>
                            <div class="notification-actions">
                                <button class="btn btn-sm btn-outline-primary me-1" 
                                        onclick="event.stopPropagation(); markAsRead(this.getAttribute('data-id'))"
                                        th:data-id="${notif.id}"
                                        th:if="${!notif.read}">
                                    <i class="fas fa-check"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" 
                                        onclick="event.stopPropagation(); deleteNotification(this.getAttribute('data-id'))"
                                        th:data-id="${notif.id}">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="card-footer text-center text-muted small py-3" th:if="${notifications != null and not #lists.isEmpty(notifications)}">
        <span th:text="'Showing ' + ${#lists.size(notifications)} + ' notifications'"></span>
    </div>
</div>

    <!-- Hidden form for CSRF -->
    <form id="csrfForm" style="display: none;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    </form>

    <th:block layout:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script th:inline="javascript">
            /*<![CDATA[*/
            
            function viewNotification(id) {
                window.location.href = '/notifications/' + id;
            }

            function markAsRead(id) {
                fetch('/notifications/' + id + '/read', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': document.querySelector('input[name="_csrf"]').value
                    }
                }).then(response => {
                    if (response.ok) {
                        location.reload();
                    }
                });
            }

            function markAllAsRead() {
                Swal.fire({
                    title: 'Mark all as read?',
                    text: 'This will mark all notifications as read.',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'Yes, mark all as read'
                }).then((result) => {
                    if (result.isConfirmed) {
                        fetch('/notifications/mark-all-read', {
                            method: 'POST',
                            headers: {
                                'X-CSRF-TOKEN': document.querySelector('input[name="_csrf"]').value
                            }
                        }).then(() => {
                            location.reload();
                        });
                    }
                });
            }

            function deleteNotification(id) {
                Swal.fire({
                    title: 'Delete notification?',
                    text: 'This action cannot be undone.',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#d33',
                    cancelButtonColor: '#3085d6',
                    confirmButtonText: 'Yes, delete it'
                }).then((result) => {
                    if (result.isConfirmed) {
                        fetch('/notifications/' + id + '/delete', {
                            method: 'POST',
                            headers: {
                                'X-CSRF-TOKEN': document.querySelector('input[name="_csrf"]').value
                            }
                        }).then(() => {
                            location.reload();
                        });
                    }
                });
            }

            function clearAll() {
                Swal.fire({
                    title: 'Clear all notifications?',
                    text: 'This will permanently delete all notifications.',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#d33',
                    cancelButtonColor: '#3085d6',
                    confirmButtonText: 'Yes, clear all'
                }).then((result) => {
                    if (result.isConfirmed) {
                        fetch('/notifications/clear-all', {
                            method: 'POST',
                            headers: {
                                'X-CSRF-TOKEN': document.querySelector('input[name="_csrf"]').value
                            }
                        }).then(() => {
                            location.reload();
                        });
                    }
                });
            }

            function filterByType(type) {
                const items = document.querySelectorAll('.notification-item');
                items.forEach(item => {
                    if (type === 'all' || item.dataset.type === type) {
                        item.style.display = '';
                    } else {
                        item.style.display = 'none';
                    }
                });
                
                // Update active filter badge
                document.querySelectorAll('.filter-badge').forEach(badge => {
                    badge.classList.remove('active');
                });
                event.target.classList.add('active');
            }

            function searchNotifications() {
                const searchTerm = document.getElementById('searchInput').value.toLowerCase();
                const items = document.querySelectorAll('.notification-item');
                
                items.forEach(item => {
                    const text = item.textContent.toLowerCase();
                    if (text.includes(searchTerm)) {
                        item.style.display = '';
                    } else {
                        item.style.display = 'none';
                    }
                });
            }

            // Auto-refresh unread count
            function updateUnreadCount() {
                fetch('/notifications/unread-count')
                    .then(response => response.text())
                    .then(count => {
                        const badge = document.getElementById('notificationBadge');
                        if (badge) {
                            if (count > 0) {
                                badge.textContent = count;
                                badge.style.display = 'inline';
                            } else {
                                badge.style.display = 'none';
                            }
                        }
                    });
            }

            // Update every 30 seconds
            setInterval(updateUnreadCount, 30000);
            
            /*]]>*/
        </script>
    </th:block>
</body>
</html>
